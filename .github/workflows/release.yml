# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

# A release is a tag on main, and the packages it names were built somewhere
# this workflow is not.
#
# No Quartus runs on GitHub. Packages come from the orchestrator's
# tools/runner-build on the controlled builders, against a private Quartus
# image that is never uploaded to Actions or a registry.
# report.sh exiting 3 on negative slack, and a SEED refit on a timing miss,
# live in the harness rather than in this file. A package that ships was fit
# to flash where it was built, and is the bitstream tested on a Pocket.
#
# What CI does on a tag is check that the release the orchestrator published
# is the one the tag names: both packages and their reports are present, the
# checksums verify, and the version stamped into each core.json is the tag.
# Nothing here builds, uploads or clobbers.
#
# The ancestry check is what keeps this a release of main: `on: push: tags`
# has no branch filter and GitHub offers none, so a tag on a scratch branch
# would otherwise pass. The branch is named in env because it has moved
# before, from cheats to master to main.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  RELEASE_BRANCH: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the release date
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          source tools/podman/version.sh
          pocket_version "$GITHUB_REF_NAME"

      - name: Require the tag to be on the release branch
        run: |
          git fetch --no-tags origin "$RELEASE_BRANCH"
          if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "$GITHUB_REF_NAME is on $RELEASE_BRANCH."
          else
            echo "::error::${GITHUB_REF_NAME} is not on ${RELEASE_BRANCH}." \
                 "Releases are built from that branch only; merge it first" \
                 "and tag the merge."
            exit 1
          fi

      # The same suite test.yml runs on every push to main.
      - name: Simulation suite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends iverilog
          python3 tools/cheats/genmenu.py --check
          python3 tools/cheats/ggdecode.py --test
          mkdir -p build/sim
          iverilog -g2012 -o build/sim/tb_codes tools/sim/tb_codes.sv src/gb/cheatcodes.sv 2>/dev/null
          vvp build/sim/tb_codes
          iverilog -g2012 -o build/sim/tb_fast tools/sim/tb_cheat_loader_fast.sv src/gb/cheat_loader.sv
          vvp build/sim/tb_fast
          python3 tools/sim/run_fixtures.py
          python3 tools/sim/run_e2e.py

      # The published packages, checked rather than produced. `gh` reads the
      # release; nothing here writes one. On dispatch, the latest release.
      - name: Verify the published packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          source tools/podman/version.sh
          pocket_version "$tag"
          git merge-base --is-ancestor "$tag" HEAD
          version="${tag#v}"
          mkdir -p dist && cd dist
          gh release download "$tag" --repo "$GITHUB_REPOSITORY"
          sha256sum -c SHA256SUMS
          gpg --batch --import RELEASE-KEY.asc
          gpg --batch --status-fd 1 --verify SHA256SUMS.asc SHA256SUMS \
            | command grep -F '[GNUPG:] VALIDSIG 7268DF1E6F75DA7731A46B65888C35858FEACF72 '
          for signature in *.sig; do
            gpg --batch --verify "$signature" "${signature%.sig}"
          done
          for core in GBC GB; do
            unzip -p "kroy.${core}_${version}.zip" "Cores/kroy.${core}/core.json" \
              | python3 -c "import json,sys; v=json.load(sys.stdin)['core']['metadata']['version']; print('$core stamped', v); sys.exit(v != '$version')"
          done
          echo "$tag: packages present, checksums and signatures verified, versions stamped."
